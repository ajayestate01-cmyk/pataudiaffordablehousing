<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ycon Platinum Heights - Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap');
        :root { --ycon-green: #00BF63; }
        body { font-family: 'Open Sans', sans-serif; color: #1A1A1A; overflow-x: hidden; }
        .font-heading { font-family: 'Montserrat', sans-serif; }
        .btn-ycon { background-color: var(--ycon-green); color: white; font-weight: 700; padding: 12px 28px; text-transform: uppercase; font-size: 11px; letter-spacing: 1.5px; transition: all 0.3s ease; display: inline-block; text-align: center; }
        .modal-overlay { background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(5px); }
    </style>
</head>
<body class="bg-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const ProjectsPage = () => {
            const [selectedImg, setSelectedImg] = useState(null);

            const projectImages = [
                
                "https://i.ibb.co/WWG9fBZK/YCON-images-1.jpg",
                "https://i.ibb.co/mQLGYHD/YCON-images-2.jpg",
                "https://i.ibb.co/wFxwrMyF/YCON-images-3.jpg",
                "https://i.ibb.co/NghLgDwy/YCON-images-4.jpg",
                "https://i.ibb.co/0VGmYFP0/YCON-images-5.jpg",
                
            ];

            return (
                <div className="relative">
                    {/* MODAL POP-UP */}
                    {selectedImg && (
                        <div className="fixed inset-0 z-[1000] flex items-center justify-center p-4 modal-overlay">
                            <button 
                                onClick={() => setSelectedImg(null)}
                                className="absolute top-10 right-10 text-white text-4xl hover:text-[#00BF63] transition-colors"
                            >
                                <i className="fas fa-times"></i>
                            </button>
                            <img 
                                src={selectedImg} 
                                className="max-w-full max-h-[90vh] object-contain shadow-2xl rounded"
                                alt="Expanded View"
                            />
                        </div>
                    )}

                    <nav className="py-10 border-b border-slate-50">
                        <div className="max-w-6xl mx-auto px-6 flex justify-between items-center">
                            <div className="flex flex-col items-start">
                                <div className="text-3xl font-heading font-extrabold tracking-tighter">YCON</div>
                                <div className="text-[9px] -mt-1 font-bold tracking-[0.6em] text-slate-400 uppercase">Infra Projects</div>
                            </div>
                            <a href="index.html" className="text-[10px] font-extrabold uppercase tracking-widest text-slate-400 hover:text-[#00BF63] border-b-2 border-transparent hover:border-[#00BF63] pb-1 transition-all">Close Projects</a>
                        </div>
                    </nav>

                    <header className="py-24 text-center bg-slate-50">
                        <div className="max-w-4xl mx-auto px-6">
                            <h5 className="text-[#00BF63] font-bold uppercase text-[10px] tracking-[0.5em] mb-6">Our Projects</h5>
                            <h1 className="font-heading text-5xl md:text-7xl font-extrabold uppercase tracking-tighter leading-none mb-8">
                                Platinum  <br/> Heights
                            </h1>
                            <p className="text-slate-400 font-medium text-[15px] max-w-lg mx-auto leading-relaxed">
                                for affordable residential launching soon
                            </p>
                        </div>
                    </header>

                    {/* About Section */}
                    <section className="max-w-6xl mx-auto px-6 grid grid-cols-1 md:grid-cols-3 gap-12 py-20">
                        <div className="md:col-span-2">
                            <h3 className="font-heading text-2xl font-extrabold uppercase mb-6">About the Project</h3>
                            <p className="text-slate-500 leading-relaxed mb-6">
                                Bringing luxury sensibilities to affordable living. Our flagship Pataudi project is designed 
                                to provide families with high-quality infrastructure, green spaces, and modern amenities.
                            </p>
                            <p className="text-slate-500 leading-relaxed">
                                Featuring sustainable architecture and smart community planning, this society 
                                represents the future of urban development in the region.
                            </p>
                        </div>
                        <div className="bg-slate-50 p-8 rounded-sm">
                            <h4 className="font-bold uppercase text-[11px] tracking-widest mb-6 text-slate-400">Project Highlights</h4>
                            <ul className="space-y-4 text-sm font-semibold uppercase tracking-wider">
                                <li className="flex justify-between border-b border-slate-200 pb-2"><span>Status</span><span className="text-[#00BF63]">Coming Soon</span></li>
                                <li className="flex justify-between border-b border-slate-200 pb-2"><span>Type</span><span>Residential</span></li>
                                <li className="flex justify-between border-b border-slate-200 pb-2"><span>Location</span><span>Pataudi</span></li>
                            </ul>
                            <a href="https://wa.me/7568005371" className="btn-ycon w-full mt-8">Enquire Now</a>
                        </div>
                    </section>

                    {/* Gallery Section */}
                    <section className="max-w-6xl mx-auto px-6 py-10">
                        <h3 className="font-heading text-2xl font-extrabold uppercase mb-12 text-center">Project Gallery</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {projectImages.map((img, index) => (
                                <div 
                                    key={index} 
                                    className="overflow-hidden rounded-sm bg-slate-100 cursor-pointer group"
                                    onClick={() => setSelectedImg(img)}
                                >
                                    <img 
                                        src={img} 
                                        alt={`Gallery ${index}`} 
                                        className="w-full h-[300px] object-cover group-hover:scale-110 transition-transform duration-500"
                                    />
                                </div>
                            ))}
                        </div>
                    </section>

                    <footer className="bg-black text-white py-20 text-center mt-20">
                        <h2 className="font-heading font-extrabold text-3xl uppercase mb-6 tracking-tight">Ready to find your dream space?</h2>
                        <button className="bg-[#00BF63] px-10 py-4 font-bold uppercase text-[11px] tracking-widest hover:bg-white hover:text-black transition-all">Contact Our Sales Team</button>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ProjectsPage />);
    </script>
</body>
</html>
