<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Projects - Ycon Infra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap');
        :root { --ycon-green: #00BF63; }
        body { font-family: 'Open Sans', sans-serif; color: #1A1A1A; }
        .font-heading { font-family: 'Montserrat', sans-serif; }
        .project-card:hover img { transform: scale(1.05); }
    </style>
</head>
<body class="bg-white">
    <div id="root"></div>
    <script type="text/babel">
        const ProjectCard = ({ title, location, type, image }) => (
            <div className="project-card group cursor-pointer">
                <div className="relative overflow-hidden rounded-lg aspect-[4/5] mb-6 shadow-lg">
                    <img src={image} alt={title} className="w-full h-full object-cover transition-transform duration-700" />
                    <div className="absolute top-6 left-6 bg-white px-4 py-1 text-[10px] font-bold uppercase tracking-widest shadow-sm">{type}</div>
                </div>
                <h3 className="font-heading font-extrabold text-2xl uppercase tracking-tight group-hover:text-[#00BF63] transition-colors">{title}</h3>
                <p className="text-slate-400 text-[11px] font-bold uppercase tracking-[0.2em] mt-2">{location}</p>
            </div>
        );

        const ProjectsPage = () => {
            const projects = [
                { title: "The Emerald Suites", location: "Jaipur, Rajasthan", type: "Residential", image: "https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?q=80&w=1000" },
                { title: "Ycon Corporate Tower", location: "Gurugram, Haryana", type: "Commercial", image: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=1000" },
                { title: "Urban Living Loft", location: "Noida, UP", type: "Luxury", image: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?q=80&w=1000" },
                { title: "Grand Heritage Villas", location: "Udaipur, Rajasthan", type: "Premium", image: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1000" },
                { title: "Metro Plaza", location: "Jaipur, Rajasthan", type: "Retail", image: "https://images.unsplash.com/photo-1555636222-cae831e670b3?q=80&w=1000" },
                { title: "The Green View", location: "Chandigarh", type: "Sustainable", image: "https://images.unsplash.com/photo-1448630360428-65456885c650?q=80&w=1000" }
            ];

            return (
                <div>
                    <nav className="py-10 border-b border-slate-50">
                        <div className="max-w-6xl mx-auto px-6 flex justify-between items-center">
                            <div className="flex flex-col items-start">
                                <div className="text-3xl font-heading font-extrabold tracking-tighter">YCON</div>
                                <div className="text-[9px] -mt-1 font-bold tracking-[0.6em] text-slate-400 uppercase">Infra Portfolio</div>
                            </div>
                            <a href="index.html" className="text-[10px] font-extrabold uppercase tracking-widest text-slate-400 hover:text-[#00BF63] border-b-2 border-transparent hover:border-[#00BF63] pb-1 transition-all">Close Projects</a>
                        </div>
                    </nav>

                    <header className="py-24 text-center bg-slate-50">
                        <div className="max-w-4xl mx-auto px-6">
                            <h5 className="text-[#00BF63] font-bold uppercase text-[10px] tracking-[0.5em] mb-6">Our Portfolio</h5>
                            <h1 className="font-heading text-5xl md:text-7xl font-extrabold uppercase tracking-tighter leading-none mb-8">
                                Iconic <br/> Landmarks
                            </h1>
                            <p className="text-slate-400 font-medium text-[15px] max-w-lg mx-auto leading-relaxed">
                                From premium residential complexes to cutting-edge commercial spaces, explore how we are building the future.
                            </p>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-6 py-24">
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-10 gap-y-20">
                            {projects.map((p, i) => <ProjectCard key={i} {...p} />)}
                        </div>
                    </main>

                    <footer className="bg-black text-white py-20 text-center">
                        <h2 className="font-heading font-extrabold text-3xl uppercase mb-6 tracking-tight">Ready to find your dream space?</h2>
                        <button className="bg-[#00BF63] px-10 py-4 font-bold uppercase text-[11px] tracking-widest hover:bg-white hover:text-black transition-all">Contact Our Sales Team</button>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ProjectsPage />);
    </script>
</body>
</html>
