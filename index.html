<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pataudihousing</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap');
        :root { --ycon-green: #00BF63; }
        body { font-family: 'Open Sans', sans-serif; color: #1A1A1A; margin: 0; }
        .font-heading { font-family: 'Montserrat', sans-serif; }
        .btn-ycon {
            background-color: var(--ycon-green);
            color: white;
            font-weight: 700;
            padding: 12px 28px;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            display: inline-block;
            text-decoration: none;
        }
        .btn-ycon:hover {
            background-color: #008f4a;
            transform: translateY(-2px);
        }
        .stats-divider {
            height: 40px;
            width: 1px;
            background-color: #E5E7EB;
        }
        .whatsapp-float {
            position: fixed;
            width: 60px;
            height: 60px;
            bottom: 40px;
            right: 40px;
            background-color: #25d366;
            color: #FFF;
            border-radius: 50px;
            text-align: center;
            font-size: 30px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .whatsapp-float:hover {
            transform: scale(1.1);
            background-color: #128c7e;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const ContactForm = () => {
            const [status, setStatus] = React.useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                setStatus('Sending...');
                const formData = new FormData(e.target);
                
                fetch('https://script.google.com/macros/s/AKfycbyqrZ4q6eMXJuibOK383BIduChr_vk3SmloSZ2PHXX-Uu3u5vGqTzolngFjLHZXaX1-ow/exec', {
                    method: 'POST',
                    body: formData,
                    mode: 'no-cors'
                })
                .then(() => {
                    setStatus('Success! We will contact you soon.');
                    e.target.reset();
                })
                .catch(() => setStatus('Submission failed. Please try again.'));
            };

            return (
                <div className="bg-white p-8 shadow-xl rounded-xl border border-slate-100">
                    <h3 className="text-2xl font-bold text-gray-800 font-heading mb-6 uppercase tracking-tight">Enquiry Form</h3>
                    <form onSubmit={handleSubmit} className="space-y-4">
                        <div>
                            <label className="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-2">Full Name</label>
                            <input name="Name" type="text" className="w-full border border-gray-200 p-3 rounded outline-none focus:border-[#00BF63] transition-all bg-slate-50" required />
                        </div>
                        <div>
                            <label className="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-2">Phone Number</label>
                            <input name="Phone" type="tel" className="w-full border border-gray-200 p-3 rounded outline-none focus:border-[#00BF63] transition-all bg-slate-50" required />
                        </div>
                        <div>
                            <label className="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-2">Email Address</label>
                            <input name="Email" type="email" className="w-full border border-gray-200 p-3 rounded outline-none focus:border-[#00BF63] transition-all bg-slate-50" required />
                        </div>
                        <div>
                            <label className="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-2">Message</label>
                            <textarea name="Message" className="w-full border border-gray-200 p-3 rounded h-24 outline-none focus:border-[#00BF63] transition-all bg-slate-50" required placeholder="How can we help you?"></textarea>
                        </div>
                        <button type="submit" className="w-full bg-[#00BF63] text-white font-bold py-4 rounded hover:bg-[#008f4a] transition-all uppercase text-xs tracking-widest shadow-lg shadow-green-100">
                            Submit Request
                        </button>
                        {status && <p className="text-center mt-4 text-sm font-bold text-[#00BF63]">{status}</p>}
                    </form>
                </div>
            );
        };

        const App = () => {
            const stats = [
                { label: "YEARS EXPERIENCE", value: "5+" },
                { label: "PROJECTS DELIVERED", value: "10+" },
                { label: "HAPPY FAMILIES", value: "500+" },
                { label: "CITIES", value: "3+" }
            ];
            
            const whatsappNumber = "9958108800";
            
            return (
                <div className="relative">
                    {/* Floating WhatsApp */}
                    <a href={`https://wa.me/${whatsappNumber}`} className="whatsapp-float" target="_blank" rel="noopener noreferrer">
                        <i className="fab fa-whatsapp"></i>
                    </a>

                    {/* Nav */}
                    <nav className="bg-white pt-10 pb-12">
                        <div className="max-w-6xl mx-auto px-6 flex justify-between items-center text-[11px] font-bold uppercase tracking-[0.3em] text-slate-800">
                            <div className="cursor-pointer hover:text-[#00BF63]">HOME</div>
                            <div className="flex flex-col items-center">
                                <div className="text-3xl font-heading font-extrabold tracking-tighter">YCON</div>
                                <div className="text-[9px] -mt-1 font-bold tracking-[0.6em] text-slate-400">INFRA</div>
                            </div>
                            <a href="projects.html" className="cursor-pointer hover:text-[#00BF63] no-underline">PROJECTS</a>
                        </div>
                    </nav>

                    {/* Hero */}
                    <header className="text-center pb-20">
                        <div className="max-w-5xl mx-auto px-6">
                            <h1 className="text-[#00BF63] font-heading text-5xl md:text-7xl font-extrabold uppercase mb-6 leading-[1.1] tracking-tighter">
                                Pataudi's First Affordable Housing
                            </h1>
                            <p className="text-slate-500 text-sm mb-10 tracking-widest font-semibold uppercase">Premium Living at Unbeatable Prices</p>
                            <a href="#enquiry" className="btn-ycon">ENQUIRE NOW</a>
                        </div>
                    </header>

                    <section className="h-[400px] overflow-hidden">
                        <img src="https://i.ibb.co/DgDGtSLq/Screenshot-2026-04-10-093549.png" className="w-full h-full object-cover" />
                    </section>

                    {/* Vision */}
                    <section className="py-24">
                        <div className="max-w-6xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 gap-16 items-center">
                            <div>
                                <h5 className="text-[#00BF63] font-bold uppercase text-[10px] tracking-[0.4em] mb-5">OUR VISION</h5>
                                <h2 className="text-[#1A1A1A] font-heading text-4xl font-extrabold uppercase mb-8 leading-tight">Redefining the <br/>Real Estate Landscape</h2>
                                <p className="text-slate-500 mb-10 leading-relaxed text-[15px]">At Ycon Infra, we aim to redefine the real estate landscape by creating sustainable and innovative living spaces for every family.</p>
                                <a href="projects.html" className="btn-ycon">EXPLORE PROJECTS</a>
                            </div>
                            <div className="flex justify-center md:justify-end">
                                <img src="https://i.ibb.co/LdcsyJGp/Screenshot-2026-04-10-095338.png" className="w-[320px] h-[320px] object-cover rounded shadow-2xl" />
                            </div>
                        </div>
                    </section>

                    {/* Stats */}
                    <section className="bg-slate-50 py-14 border-y border-slate-100">
                        <div className="max-w-6xl mx-auto px-6 flex flex-wrap justify-center items-center gap-8 md:gap-0 text-center">
                            {stats.map((stat, i) => (
                                <React.Fragment key={i}>
                                    <div className="flex-1 min-w-[120px]">
                                        <div className="text-4xl font-extrabold font-heading text-[#1A1A1A]">{stat.value}</div>
                                        <div className="text-[10px] uppercase font-bold text-slate-400 mt-2 tracking-widest">{stat.label}</div>
                                    </div>
                                    {i < stats.length - 1 && <div className="hidden md:block stats-divider"></div>}
                                </React.Fragment>
                            ))}
                        </div>
                    </section>

                    {/* ENQUIRY SECTION */}
                    <section id="enquiry" className="py-24 bg-white">
                        <div className="max-w-6xl mx-auto px-6">
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-16">
                                {/* Left Side: Form */}
                                <div>
                                    <ContactForm />
                                </div>

                                {/* Right Side: Simplified Info */}
                                <div className="flex flex-col justify-center">
                                    <h5 className="text-[#00BF63] font-bold uppercase text-[10px] tracking-[0.4em] mb-5">GET IN TOUCH</h5>
                                    <h2 className="text-[#1A1A1A] font-heading text-4xl font-extrabold uppercase mb-8 leading-tight">Ready to find <br/>your dream home?</h2>
                                    
                                    <div className="space-y-10">
                                        <div className="flex items-start gap-5">
                                            <div className="bg-slate-50 p-4 rounded-full text-[#00BF63] shadow-sm">
                                                <i className="fas fa-location-dot text-xl"></i>
                                            </div>
                                            <div>
                                                <h4 className="font-bold text-xs uppercase tracking-widest mb-2 text-slate-400">Our Location</h4>
                                                <p className="text-[#1A1A1A] font-semibold text-lg leading-snug">Sector 3, Pataudi, <br/>Gurugram, Haryana - 122503</p>
                                            </div>
                                        </div>

                                        <div className="flex items-start gap-5">
                                            <div className="bg-slate-50 p-4 rounded-full text-[#00BF63] shadow-sm">
                                                <i className="fas fa-phone-volume text-xl"></i>
                                            </div>
                                            <div>
                                                <h4 className="font-bold text-xs uppercase tracking-widest mb-2 text-slate-400">Direct Call</h4>
                                                <p className="text-[#1A1A1A] font-semibold text-lg leading-snug">+91 99581 08800</p>
                                                <p className="text-slate-500 text-sm mt-1">Mon - Sat: 9:00 AM - 7:00 PM</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="py-12 bg-slate-900 text-center">
                        <div className="text-white text-3xl font-heading font-extrabold tracking-tighter">YCON</div>
                        <div className="text-[9px] font-bold tracking-[0.6em] text-slate-500 mb-6 uppercase">Infra Group</div>
                        <p className="text-slate-500 text-xs">© 2026 Ycon Infra. All Rights Reserved.</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
